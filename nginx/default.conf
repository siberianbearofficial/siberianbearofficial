# Two sites, one build. Traefik forwards the original Host header, so nginx
# picks the server block by domain. The first block is also nginx's implicit
# default, so anything unexpected lands on the CV site.
#
# Each domain serves its default language from the root and the second language
# from a prefix, which is what gives every page a distinct URL for hreflang:
#
#   aleksei-orlov.ru   /          /en/          /resume/   /en/resume/
#   aleksei-orlov.dev  /          /ru/
#
# Both trees live in the same dist/, so each block has to redirect the paths
# that belong to the other domain instead of quietly serving a duplicate.

# aleksei-orlov.ru - the hiring / CV site. Russian at the root, English at /en/.
server {
    listen 80;
    server_name aleksei-orlov.ru www.aleksei-orlov.ru;

    root /usr/share/nginx/html;
    index index.html;

    # One build, two domains: a shared /sitemap.xml would have to list URLs
    # from both, so each domain gets its own file under the canonical name.
    location = /sitemap.xml {
        try_files /sitemap-ru.xml =404;
    }

    location = /robots.txt {
        try_files /robots-ru.txt =404;
    }

    # The root is already Russian, so /ru/ would be a second URL for one page.
    location = /ru {
        return 301 https://aleksei-orlov.ru/;
    }

    location = /ru/ {
        return 301 https://aleksei-orlov.ru/;
    }

    # The services page has its own domain now.
    location = /services {
        return 301 https://aleksei-orlov.dev/;
    }

    location = /services/ {
        return 301 https://aleksei-orlov.dev/;
    }

    location = /services/ru {
        return 301 https://aleksei-orlov.dev/ru/;
    }

    location = /services/ru/ {
        return 301 https://aleksei-orlov.dev/ru/;
    }

    # Filenames under these paths are stable, so a week of browser cache costs
    # nothing and takes the portrait and the logos off the critical path.
    location ~ ^/(media|og)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# aleksei-orlov.dev - the client-facing services site. English at the root,
# Russian at /ru/.
server {
    listen 80;
    server_name aleksei-orlov.dev www.aleksei-orlov.dev;

    root /usr/share/nginx/html;
    index index.html;

    location = /sitemap.xml {
        try_files /sitemap-dev.xml =404;
    }

    location = /robots.txt {
        try_files /robots-dev.txt =404;
    }

    location = / {
        try_files /services/index.html =404;
    }

    location = /ru/ {
        try_files /services/ru/index.html =404;
    }

    location = /ru {
        return 301 https://aleksei-orlov.dev/ru/;
    }

    # Absolute https: Traefik terminates TLS, so a relative redirect here
    # would hand the browser an http:// Location and cost an extra hop.
    location = /services {
        return 301 https://aleksei-orlov.dev/;
    }

    location = /services/ {
        return 301 https://aleksei-orlov.dev/;
    }

    location = /services/ru {
        return 301 https://aleksei-orlov.dev/ru/;
    }

    location = /services/ru/ {
        return 301 https://aleksei-orlov.dev/ru/;
    }

    # dist/en/ is the English CV, which belongs to the other domain. Without
    # these the catch-all below would serve it here as a duplicate.
    location = /en {
        return 301 https://aleksei-orlov.dev/;
    }

    location = /en/ {
        return 301 https://aleksei-orlov.dev/;
    }

    location = /en/resume {
        return 301 https://aleksei-orlov.ru/en/resume/;
    }

    location = /en/resume/ {
        return 301 https://aleksei-orlov.ru/en/resume/;
    }

    # The CV, the resume pages, and the PDFs belong to the .ru domain. Keeping
    # one copy of each keeps the two domains out of each other's search results.
    location = /cv {
        return 301 https://aleksei-orlov.ru/;
    }

    location = /cv/ {
        return 301 https://aleksei-orlov.ru/;
    }

    location = /resume {
        return 301 https://aleksei-orlov.ru/resume/;
    }

    location = /resume/ {
        return 301 https://aleksei-orlov.ru/resume/;
    }

    location = /Aleksei-Orlov-Resume.pdf {
        return 301 https://aleksei-orlov.ru/Aleksei-Orlov-Resume.pdf;
    }

    location = /Aleksei-Orlov-Resume-RU.pdf {
        return 301 https://aleksei-orlov.ru/Aleksei-Orlov-Resume-RU.pdf;
    }

    location ~ ^/(media|og)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
