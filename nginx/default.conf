# Default host: the CV / portfolio site.
# Serves the hiring page at / and the client-facing page at /services/.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Client-facing host, served from the same build.
# Point a second domain (for example aleksei-orlov.com or .dev) at this
# container and add it to server_name below. The services page then becomes
# the root of that domain and the CV moves to /cv/, with no rebuild needed.
server {
    listen 80;
    server_name client.invalid;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /services/index.html =404;
    }

    location = /services {
        return 301 /;
    }

    location = /services/ {
        return 301 /;
    }

    location = /cv {
        return 301 /cv/;
    }

    location = /cv/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
