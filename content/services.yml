services:
  - key: llm-assistant
    name:
      en: Internal LLM Assistant
      ru: Внутренний LLM-ассистент
    icon: messages-square
    price:
      en: from $4,000
      ru: от $4 000
    timeline:
      en: 3 to 5 weeks
      ru: 3–5 недель
    featured: true
    problem:
      en: >
        Leadership decided the company needs AI. Nobody can say what to actually
        build, and the pilot that someone started in a notebook does not survive
        contact with real employees
      ru: >
        Руководство решило, что компании нужен AI. Что именно строить, сказать
        никто не может, а пилот, который кто-то начал в ноутбуке, не переживает
        встречи с живыми сотрудниками
    outcome:
      en: >
        A working internal assistant your team uses: retrieval over your own
        documentation, tool calls into your own systems, authentication, and an
        interface that does not need a workshop to explain
      ru: >
        Рабочий внутренний ассистент, которым пользуются: поиск по вашей
        документации, вызовы ваших систем, аутентификация и интерфейс, к которому
        не нужен отдельный воркшоп
    includes:
      - en: Retrieval pipeline over your documentation, with an evaluation set so quality is measured instead of argued about
        ru: Пайплайн поиска по вашей документации и набор для оценки, чтобы качество измеряли, а не обсуждали
      - en: Tool and function calling into your internal APIs, with schema validation, timeouts, and sane failure behaviour
        ru: "Вызовы ваших внутренних API как инструментов: валидация схем, таймауты и вменяемое поведение при ошибках"
      - en: Streaming chat interface in React, built to your design system rather than a generic template
        ru: Стриминговый чат-интерфейс на React по вашей дизайн-системе, а не по универсальному шаблону
      - en: SSO integration and access control that matches how your company already handles identity
        ru: Интеграция SSO и разграничение доступа так, как это уже устроено у вас
      - en: Deployment into your infrastructure, plus written handover so your team can extend it
        ru: Развертывание в вашей инфраструктуре и письменная передача, чтобы команда могла развивать дальше
    note:
      en: >
        Already running Open WebUI or LibreChat internally? Most of this work is
        making that deployment real: SSO against your identity provider,
        retrieval over your own documentation with an evaluation set, and tool
        calls into your own APIs.
      ru: >
        Уже развернули Open WebUI или LibreChat внутри компании? Большая часть
        этой работы — довести такую установку до рабочего состояния: SSO с вашим
        провайдером идентификации, поиск по вашей документации с набором для
        оценки и вызовы ваших собственных API.
  - key: migration-audit
    name:
      en: Angular to React Migration Audit
      ru: Аудит миграции с Angular на React
    icon: route
    price:
      en: $1,200
      ru: $1 200
    timeline:
      en: 1 week
      ru: 1 неделя
    featured: false
    problem:
      en: >
        You have an Angular codebase, a React hiring market, and no credible
        answer to how long a migration takes or what it puts at risk. So the
        decision keeps getting postponed
      ru: >
        У вас кодовая база на Angular, рынок найма на React и ни одного честного
        ответа, сколько займет миграция и чем она рискует. Поэтому решение
        откладывается снова и снова
    outcome:
      en: >
        A migration roadmap you can put in front of a budget holder: what moves
        first, what stays, what it costs, and where the real risk sits
      ru: >
        План миграции, который можно положить на стол тому, кто держит бюджет:
        что переезжает первым, что остается, сколько это стоит и где реальный риск
    includes:
      - en: Structured audit of your repository, dependency graph, and framework-specific coupling
        ru: Структурированный аудит репозитория, графа зависимостей и привязок к фреймворку
      - en: Incremental migration plan by product surface, designed so feature delivery never stops
        ru: План поэтапной миграции по продуктовым экранам, при котором разработка фич не останавливается
      - en: Risk register covering state management, routing, shared components, and test coverage gaps
        ru: Реестр рисков по состоянию, роутингу, общим компонентам и дырам в тестах
      - en: Effort estimate per surface, in ranges honest enough to plan against
        ru: Оценка трудоемкости по каждому экрану — вилками, по которым реально планировать
      - en: Ninety minute walkthrough call with your engineering leads
        ru: Полуторачасовой разбор с вашими техлидами
    footnote:
      en: >
        The audit fee is credited toward the migration if you decide to go ahead.
        Full migrations typically run from $15,000 depending on surface count
      ru: >
        Стоимость аудита засчитывается в миграцию, если решите ее делать. Полная
        миграция обычно от $15 000 в зависимости от количества экранов
  - key: mvp-rescue
    name:
      en: Vibe-Coded MVP Rescue
      ru: Спасение MVP, собранного на вайбе
    icon: wrench
    price:
      en: from $3,000
      ru: от $3 000
    timeline:
      en: 2 weeks
      ru: 2 недели
    featured: false
    problem:
      en: >
        The MVP got built fast with AI tooling, found real users, and now breaks
        in production. Nobody on the team fully understands the code, and every
        fix creates two new bugs
      ru: >
        MVP быстро собрали с помощью AI, у него появились живые пользователи, и
        теперь он падает в проде. Целиком код не понимает никто, и каждая правка
        рождает два новых бага
    outcome:
      en: >
        A codebase that stops surprising you: the dangerous parts fixed, the rest
        documented, and a written map of what still needs work
      ru: >
        Кодовая база, которая перестает удивлять: опасные места починены,
        остальное описано, и есть письменная карта того, что еще требует работы
    includes:
      - en: Audit of authentication, data model, and error handling, ranked by how badly each can hurt you
        ru: Аудит аутентификации, модели данных и обработки ошибок с ранжированием по тому, как сильно каждое место может ударить
      - en: Fixes to the failures that actually reach users, shipped first
        ru: В первую очередь — починка тех отказов, которые доходят до пользователей
      - en: Tests and CI on the paths that carry revenue, not blanket coverage theatre
        ru: Тесты и CI на путях, которые приносят деньги, а не покрытие ради покрытия
      - en: Written map of remaining technical debt with a cost estimate for each item
        ru: Письменная карта оставшегося техдолга с оценкой стоимости по каждому пункту
  - key: ai-reliability
    name:
      en: AI Reliability Engineering
      ru: Надежность AI-фич
    icon: workflow
    price:
      en: from $2,500
      ru: от $2 500
    timeline:
      en: 2 to 3 weeks
      ru: 2–3 недели
    featured: false
    problem:
      en: >
        You wired an LLM into your product. It works in the demo and fails for
        users: malformed outputs, hung requests, jobs that vanish, and no way to
        tell whether a prompt change made things better or worse
      ru: >
        Вы встроили LLM в продукт. В демо работает, у пользователей ломается:
        битые ответы, зависшие запросы, исчезнувшие задачи и никакой возможности
        понять, стало ли лучше после правки промпта
    outcome:
      en: >
        The infrastructure layer that turns an LLM call into a dependable product
        feature
      ru: >
        Инфраструктурный слой, который превращает вызов LLM в предсказуемую
        продуктовую фичу
    includes:
      - en: Structured outputs with schema validation and retry behaviour that degrades gracefully
        ru: Структурированные ответы с валидацией схемы и повторами, которые деградируют аккуратно
      - en: Tool calling that handles partial failure instead of pretending it cannot happen
        ru: Вызовы инструментов, которые обрабатывают частичный отказ, а не делают вид, что его не бывает
      - en: Async task orchestration, queues, and status handling for work that outlives a request
        ru: Оркестрация асинхронных задач, очереди и статусы для работы, которая живет дольше запроса
      - en: Token streaming that survives reconnects and slow clients
        ru: Стриминг токенов, который переживает переподключения и медленных клиентов
      - en: Evaluation harness and observability so prompt and model changes are measured, not guessed
        ru: Стенд для оценки и наблюдаемость, чтобы изменения промптов и моделей измерялись, а не угадывались
  # The catch-all tier. It exists so a client without an AI problem can still
  # see themselves on this page; the AI offers above stay the flagship.
  - key: product-engineering
    name:
      en: Fullstack Product Engineering
      ru: Fullstack-разработка продукта
    icon: app-window
    price:
      en: from $3,000
      ru: от $3 000
    timeline:
      en: 3 to 5 weeks
      ru: 3–5 недель
    featured: false
    problem:
      en: >
        Your project has no LLM in it. You need a web product built properly:
        a real interface, a real API behind it, and someone who will not hand
        you a frontend and call the backend somebody else's problem
      ru: >
        В вашем проекте нет никакого LLM. Нужно нормально сделать веб-продукт:
        настоящий интерфейс, настоящий API за ним и человек, который не отдаст
        вам фронтенд со словами «бэкенд — это к другим»
    outcome:
      en: >
        A working web application in production: React on the front, FastAPI
        behind it, deployed in your infrastructure with the same fixed scope and
        fixed price as everything else on this page
      ru: >
        Работающее веб-приложение в проде: React на фронте, FastAPI за ним,
        развернуто в вашей инфраструктуре — с тем же фиксированным объемом и
        фиксированной ценой, что и все остальное на этой странице
    includes:
      - en: Product surface in React and TypeScript, built to your design system or to a clean default if you do not have one
        ru: Продуктовый интерфейс на React и TypeScript по вашей дизайн-системе или по аккуратному дефолту, если ее нет
      - en: FastAPI backend with a data model, migrations, and API contracts your next developer can read
        ru: Бэкенд на FastAPI с моделью данных, миграциями и контрактами API, которые прочитает следующий разработчик
      - en: Authentication, roles, and third-party integrations wired end to end rather than stubbed for the demo
        ru: Аутентификация, роли и интеграции со сторонними сервисами доведены до конца, а не заглушены ради демо
      - en: Deployment, Docker packaging, and CI so shipping the next change does not require me
        ru: Развертывание, упаковка в Docker и CI, чтобы следующее изменение можно было выпустить без меня
      - en: Written handover covering the architecture, the trade-offs taken, and what to build next
        ru: "Письменная передача: архитектура, принятые компромиссы и что делать дальше"
    footnote:
      en: >
        This is the catch-all tier. If your problem is an AI problem, one of the
        offers above will fit it better and cost you less
      ru: >
        Это универсальный вариант. Если ваша задача все-таки про AI, один из
        офферов выше подойдет лучше и обойдется дешевле

retainer:
  name:
    en: Ongoing AI feature support
    ru: Постоянная поддержка AI-фич
  icon: shield-check
  price:
    en: $1,500 to $3,000 per month
    ru: $1 500 – $3 000 в месяц
  summary:
    en: >
      For teams that shipped an AI feature and need it to keep working. Model
      releases, prompt drift, and quality regressions are ongoing problems, not
      one-time ones
    ru: >
      Для команд, которые уже выпустили AI-фичу и которым нужно, чтобы она
      продолжала работать. Новые версии моделей, дрейф промптов и просадки
      качества — это постоянные проблемы, а не разовые
  includes:
    - en: Response quality monitoring against your evaluation set
      ru: Мониторинг качества ответов по вашему набору для оценки
    - en: Prompt and model updates when providers ship changes
      ru: Обновление промптов и моделей, когда провайдеры выкатывают изменения
    - en: Small feature work and fixes within an agreed monthly scope
      ru: Небольшие фичи и правки в рамках согласованного месячного объема
    - en: A named person who already knows your codebase when something breaks
      ru: Конкретный человек, который уже знает ваш код, когда что-то сломалось

engagement_principles:
  - title:
      en: Fixed price, not hourly
      ru: Фиксированная цена, а не часы
    icon: receipt
    description:
      en: >
        You buy a defined outcome with a defined price. My speed is my problem
        to optimise, not a reason to charge you less for the same result
      ru: >
        Вы покупаете определенный результат за определенную цену. Моя скорость —
        моя забота, а не повод брать с вас меньше за тот же результат
  - title:
      en: Weekly working software
      ru: Каждую неделю — работающий софт
    icon: rocket
    description:
      en: >
        Every week you get something you can click, not a status report. If the
        direction is wrong, you find out in week one rather than week four
      ru: >
        Каждую неделю вы получаете то, что можно потыкать, а не статус-отчет.
        Если направление неверное, вы узнаете это на первой неделе, а не на
        четвертой
  - title:
      en: Your code from day one
      ru: Код ваш с первого дня
    icon: git-branch
    description:
      en: >
        Work happens in your repository under your license. There is no handover
        cliff and nothing to buy back at the end
      ru: >
        Работа идет в вашем репозитории под вашей лицензией. Нет обрыва при
        передаче и нечего выкупать в конце
  - title:
      en: Honest scope boundaries
      ru: Честные границы объема
    icon: scale
    description:
      en: >
        The proposal says what is explicitly out of scope. New scope becomes a
        new fixed-price increment instead of a quiet schedule slip
      ru: >
        В предложении прямо написано, что в объем не входит. Новый объем
        становится новым этапом с фиксированной ценой, а не тихим сдвигом сроков

case_studies:
  - key: image-generation-platform
    title:
      en: Image generation platform for a design team
      ru: Платформа генерации изображений для дизайн-команды
    kind:
      en: Angular and FastAPI, internal product
      ru: Angular и FastAPI, внутренний продукт
    icon: image
    impact:
      value: 1,000+
      label:
        en: internal users
        ru: внутренних пользователей
    problem:
      en: >
        A company-wide image generation API existed, but the designers who were
        supposed to use it had only a flat list of tasks. There was no way to
        organise work, iterate on a result, or track long-running generations
        without hammering the server with status requests
      ru: >
        Общий для компании API генерации изображений существовал, но у дизайнеров,
        которые должны были им пользоваться, был только плоский список задач.
        Организовать работу, доработать результат или следить за долгими
        генерациями, не заваливая сервер запросами статуса, было невозможно
    action:
      en: >
        I owned the Angular frontend and crossed into the FastAPI backend
        whenever a feature needed server-side work. I built a board-based
        workspace where designers group generations into project spaces, added
        drag-and-drop between boards, image reactions, and editing flows across
        several generation modes. For async work I designed a priority-queue
        polling model that schedules status checks by importance instead of
        polling everything on a fixed interval
      ru: >
        Я вел фронтенд на Angular и заходил в бэкенд на FastAPI всякий раз, когда
        фиче требовалась серверная часть. Собрал рабочее пространство на досках,
        где дизайнеры группируют генерации по проектам, добавил перетаскивание
        между досками, реакции на изображения и редактирование для нескольких
        режимов генерации. Для асинхронной части спроектировал модель опроса с
        очередью приоритетов: статусы проверяются по важности, а не все подряд
        с фиксированным интервалом
    result:
      en: >
        1,000+ internal users work in organised boards rather than a flat queue,
        and generation status stays current without aggressive polling against
        the shared API
      ru: >
        1 000+ внутренних пользователей работают на досках вместо плоской
        очереди, а статусы генераций остаются актуальными без агрессивного
        поллинга общего API
    stack:
      - Angular
      - TypeScript
      - NgRx
      - RxJS
      - FastAPI
      - PostgreSQL
  - key: generation-bff
    title:
      en: Backend that made the platform possible
      ru: Бэкенд, без которого платформы бы не было
    kind:
      en: FastAPI backend-for-frontend
      ru: Backend-for-frontend на FastAPI
    icon: workflow
    problem:
      en: >
        The shared generation API had no concept of end users, no task history,
        and no durable storage. The interface needed all three, and there was no
        separate backend team waiting to build them
      ru: >
        В общем API генерации не было ни понятия конечного пользователя, ни
        истории задач, ни надежного хранилища. Интерфейсу нужно было все три, а
        отдельной бэкенд-команды, готовой это сделать, не было
    action:
      en: >
        I designed and built a FastAPI backend-for-frontend: corporate SSO for
        end users with service-level routing to the generation API, an event
        consumer that processes completed tasks off Kafka, and persistence
        coordinated across PostgreSQL and S3. As the product grew I extended it
        to support reactions, board operations, and image post-processing
      ru: >
        Я спроектировал и написал backend-for-frontend на FastAPI: корпоративный
        SSO для конечных пользователей с сервисной маршрутизацией к API генерации,
        консьюмер событий, который забирает завершенные задачи из Kafka, и
        согласованное хранение в PostgreSQL и S3. По мере роста продукта расширил
        его под реакции, операции с досками и постобработку изображений
    result:
      en: >
        User-facing features shipped without a backend handoff in the middle,
        which is the reason the frontend could keep moving at all
      ru: >
        Пользовательские фичи выходили без передачи задачи бэкенд-команде
        посередине — именно поэтому фронтенд вообще мог двигаться
    stack:
      - FastAPI
      - Python
      - PostgreSQL
      - SQLAlchemy
      - Kafka
      - S3
  - key: assistant-migration
    title:
      en: Migrating a live AI assistant to React
      ru: Миграция живого AI-ассистента на React
    kind: React, Svelte, FastAPI
    icon: messages-square
    impact:
      value:
        en: 38,000+
        ru: 38 000+
      label:
        en: employees
        ru: сотрудников
    problem:
      en: >
        A company-wide internal LLM assistant ran on a legacy Svelte frontend
        that needed to become React. 38,000+ employees used it, so stopping
        feature delivery for a rewrite was never an option
      ru: >
        Внутренний LLM-ассистент на всю компанию работал на легаси-фронтенде на
        Svelte, который нужно было перевести на React. Им пользовались 38 000+
        сотрудников, так что остановить разработку ради переписывания было
        нельзя
    action:
      en: >
        I shipped product features inside the mixed Svelte and React codebase
