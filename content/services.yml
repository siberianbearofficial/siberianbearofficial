services:
  - key: llm-assistant
    name: Internal LLM Assistant
    icon: messages-square
    price: from $4,000
    timeline: 3 to 5 weeks
    featured: true
    problem: >
      Leadership decided the company needs AI. Nobody can say what to actually
      build, and the pilot that someone started in a notebook does not survive
      contact with real employees
    outcome: >
      A working internal assistant your team uses: retrieval over your own
      documentation, tool calls into your own systems, authentication, and an
      interface that does not need a workshop to explain
    includes:
      - Retrieval pipeline over your documentation, with an evaluation set so quality is measured instead of argued about
      - Tool and function calling into your internal APIs, with schema validation, timeouts, and sane failure behaviour
      - Streaming chat interface in React, built to your design system rather than a generic template
      - SSO integration and access control that matches how your company already handles identity
      - Deployment into your infrastructure, plus written handover so your team can extend it
  - key: migration-audit
    name: Angular to React Migration Audit
    icon: route
    price: $1,200
    timeline: 1 week
    featured: false
    problem: >
      You have an Angular codebase, a React hiring market, and no credible
      answer to how long a migration takes or what it puts at risk. So the
      decision keeps getting postponed
    outcome: >
      A migration roadmap you can put in front of a budget holder: what moves
      first, what stays, what it costs, and where the real risk sits
    includes:
      - Structured audit of your repository, dependency graph, and framework-specific coupling
      - Incremental migration plan by product surface, designed so feature delivery never stops
      - Risk register covering state management, routing, shared components, and test coverage gaps
      - Effort estimate per surface, in ranges honest enough to plan against
      - Ninety minute walkthrough call with your engineering leads
    footnote: >
      The audit fee is credited toward the migration if you decide to go ahead.
      Full migrations typically run from $15,000 depending on surface count
  - key: mvp-rescue
    name: Vibe-Coded MVP Rescue
    icon: wrench
    price: from $3,000
    timeline: 2 weeks
    featured: false
    problem: >
      The MVP got built fast with AI tooling, found real users, and now breaks
      in production. Nobody on the team fully understands the code, and every
      fix creates two new bugs
    outcome: >
      A codebase that stops surprising you: the dangerous parts fixed, the rest
      documented, and a written map of what still needs work
    includes:
      - Audit of authentication, data model, and error handling, ranked by how badly each can hurt you
      - Fixes to the failures that actually reach users, shipped first
      - Tests and CI on the paths that carry revenue, not blanket coverage theatre
      - Written map of remaining technical debt with a cost estimate for each item
  - key: ai-reliability
    name: AI Reliability Engineering
    icon: workflow
    price: from $2,500
    timeline: 2 to 3 weeks
    featured: false
    problem: >
      You wired an LLM into your product. It works in the demo and fails for
      users: malformed outputs, hung requests, jobs that vanish, and no way to
      tell whether a prompt change made things better or worse
    outcome: >
      The infrastructure layer that turns an LLM call into a dependable product
      feature
    includes:
      - Structured outputs with schema validation and retry behaviour that degrades gracefully
      - Tool calling that handles partial failure instead of pretending it cannot happen
      - Async task orchestration, queues, and status handling for work that outlives a request
      - Token streaming that survives reconnects and slow clients
      - Evaluation harness and observability so prompt and model changes are measured, not guessed

