      ru: >
        Я выпускал продуктовые фичи внутри смешанной кодовой базы Svelte и React,
        одновременно перенося продуктовую логику в зоны React, и правил бэкенд на
        FastAPI там, где это требовалось фиче. Параллельно помог выстроить более
        строгие требования к новому React-коду с Vitest, Biome, Oxlint и
        Playwright, чтобы новая часть не унаследовала проблемы старой
    result:
      en: >
        Migration and feature delivery ran as a single track instead of two
        competing ones, on a product 38,000+ employees depend on
      ru: >
        Миграция и разработка фич шли одним треком, а не двумя конкурирующими, в
