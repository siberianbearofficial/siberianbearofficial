process:
  - step:
      en: Call
      ru: Созвон
    icon: phone
    duration:
      en: 30 minutes
      ru: 30 минут
    description:
      en: >
        You describe the problem. I tell you whether I am the right person for
        it, including when the answer is no. No slide deck, no discovery invoice
      ru: >
        Вы описываете задачу. Я говорю, тот ли я человек для нее, в том числе
        когда ответ «нет». Без презентаций и счета за «исследование»
  - step:
      en: Proposal
      ru: Предложение
    icon: file-text
    duration:
      en: 2 working days
      ru: 2 рабочих дня
    description:
      en: >
        A fixed scope, a fixed price, a delivery date, and an explicit list of
        what is not included. If it does not fit your budget, you have lost a
        phone call
      ru: >
        Фиксированный объем, фиксированная цена, дата сдачи и явный список того,
        что не входит. Если не подходит по бюджету — вы потеряли один созвон
  - step:
      en: Build
      ru: Разработка
    icon: rocket
    duration:
      en: 2 to 5 weeks
      ru: 2–5 недель
    description:
      en: >
        Work happens in your repository with something demoable every week. You
        see progress as software, and course corrections happen early
      ru: >
        Работа идет в вашем репозитории, каждую неделю есть что показать.
        Прогресс виден софтом, а корректировки курса случаются рано
  - step:
      en: Handover
      ru: Передача
    icon: package-check
    duration:
      en: Included
      ru: Входит в цену
    description:
      en: >
        Deployment, documentation, and a walkthrough with your team. You are not
        dependent on me afterwards unless you choose to be
      ru: >
        Развертывание, документация и разбор с вашей командой. После этого вы
        зависите от меня только если сами захотите

faq:
  - question:
      en: Do you work hourly?
      ru: Работаете по часам?
    answer:
      en: >
        No. Fixed price against a defined outcome. Hourly billing means you pay
        more when I am slower, which is a strange thing for both of us to want
      ru: >
        Нет. Фиксированная цена за определенный результат. Почасовая оплата
        означает, что вы платите больше, когда я работаю медленнее, — странное
        желание для нас обоих
  - question:
      en: Do you only take AI projects?
      ru: Вы беретесь только за AI-проекты?
    answer:
      en: >
        No. AI is where most of my work is and where I am most useful, but a
        product with no model in it is still a product. Fullstack Product
        Engineering above is the tier for that: React on the front, FastAPI
        behind it, same fixed scope and price
      ru: >
        Нет. Большая часть моей работы — про AI, и там я полезнее всего, но
        продукт без модели внутри остается продуктом. Для этого выше есть
        Fullstack-разработка продукта: React на фронте, FastAPI за ним, тот же
        фиксированный объем и цена
  - question:
      en: Who owns the code?
      ru: Кому принадлежит код?
    answer:
      en: >
        You do, from the first commit. Work happens in your repository under your
        license, and nothing is held back at handover
      ru: >
        Вам, с первого коммита. Работа идет в вашем репозитории под вашей
        лицензией, и при передаче ничего не придерживается
  - question:
      en: Can you sign an NDA?
      ru: Подпишете NDA?
    answer:
      en: >
        Yes. Most of my experience is on internal products under NDA already,
        which is why the case studies here describe architecture and scope rather
        than screenshots
      ru: >
        Да. Большая часть моего опыта — внутренние продукты, уже закрытые NDA,
        поэтому кейсы здесь описывают архитектуру и объем работ, а не скриншоты
  - question:
      en: What happens if the scope changes?
      ru: Что будет, если объем изменится?
    answer:
      en: >
        Small things get absorbed. Anything larger becomes a separate fixed-price
        increment that you approve before it starts, rather than a quiet slip in
        the delivery date
      ru: >
        Мелочи беру на себя. Все крупнее становится отдельным этапом с
        фиксированной ценой, который вы согласуете до начала, а не тихим сдвигом
        даты сдачи
  - question:
      en: How do you handle payment?
      ru: Как устроена оплата?
    answer:
      en: >
        Typically fifty percent up front and fifty on delivery, with longer
        projects split into milestones. Invoicing details are confirmed in
        writing before any work begins
      ru: >
        Обычно 50% предоплата и 50% по сдаче, длинные проекты разбиваются на
        этапы. Детали выставления счетов фиксируются письменно до начала работы
  - question:
      en: What timezones do you work with?
      ru: В каких часовых поясах вы работаете?
    answer:
      en: >
        I work asynchronously by default and overlap with European and Asian
        business hours. Weekly demos are scheduled to suit your team, not mine
      ru: >
        По умолчанию работаю асинхронно и пересекаюсь с рабочими часами Европы и
        Азии. Еженедельные демо ставятся под вашу команду, а не под меня

