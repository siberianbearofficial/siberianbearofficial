process:
  - step: Call
    icon: phone
    duration: 30 minutes
    description: >
      You describe the problem. I tell you whether I am the right person for
      it, including when the answer is no. No slide deck, no discovery invoice
  - step: Proposal
    icon: file-text
    duration: 2 working days
    description: >
      A fixed scope, a fixed price, a delivery date, and an explicit list of
      what is not included. If it does not fit your budget, you have lost a
      phone call
  - step: Build
    icon: rocket
    duration: 2 to 5 weeks
    description: >
      Work happens in your repository with something demoable every week. You
      see progress as software, and course corrections happen early
  - step: Handover
    icon: package-check
    duration: Included
    description: >
      Deployment, documentation, and a walkthrough with your team. You are not
      dependent on me afterwards unless you choose to be

faq:
  - question: Do you work hourly?
    answer: >
      No. Fixed price against a defined outcome. Hourly billing means you pay
      more when I am slower, which is a strange thing for both of us to want
  - question: Who owns the code?
    answer: >
      You do, from the first commit. Work happens in your repository under your
      license, and nothing is held back at handover
  - question: Can you sign an NDA?
    answer: >
      Yes. Most of my experience is on internal products under NDA already,
      which is why the case studies here describe architecture and scope rather
      than screenshots
  - question: What happens if the scope changes?
    answer: >
      Small things get absorbed. Anything larger becomes a separate fixed-price
      increment that you approve before it starts, rather than a quiet slip in
      the delivery date
  - question: How do you handle payment?
    answer: >
      Typically fifty percent up front and fifty on delivery, with longer
      projects split into milestones. Invoicing details are confirmed in
      writing before any work begins
  - question: What timezones do you work with?
    answer: >
      I work asynchronously by default and overlap with European and Asian
      business hours. Weekly demos are scheduled to suit your team, not mine

