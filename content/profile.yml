value_props:
  - title:
      en: AI Reliability
      ru: Надежность AI в продакшене
    icon: workflow
    description:
      en: >
        Structured outputs with schema validation, tool calling that handles
        partial failure, async orchestration and streaming that survives
        reconnects
      ru: >
        Structured output со строгой валидацией всех схем, tool calling,
        выживающий при ошибках или отказах внешних систем, оркестрация асинхронных 
        задач и стриминг ответов, выдерживающий переподключения
  - title:
      en: Full Product Surface
      ru: Продукт целиком
    icon: app-window
    description:
      en: >
        I ship the React interface and the FastAPI service behind it, so AI
        features do not stall on a backend handoff
      ru: >
        Я делаю и интерфейс на React, и бэкенд на FastAPI для него, так что
        AI-фичи не зависят от чужого бэкенда, а сразу едут в продакшн
  - title:
      en: Legacy Frontend Migration
      ru: Миграция легаси-фронтенда
    icon: route
    description:
      en: >
        Angular and Svelte to React in production, without freezing feature
        delivery
      ru: >
        Переписываю Angular или Svelte на React без остановки поставки продуктовых фич

