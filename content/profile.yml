case_studies:
  - key: image-generation-ui
    title:
      en: Image Generation Platform UI
      ru: Интерфейс платформы генерации изображений
    readme_featured: true
    kind:
      en: Internal design workflow tool
      ru: Внутренний инструмент для дизайнеров
    icon: image
    summary:
      en: >
        Internal web application for an AI image-generation platform used by
        designers who needed a practical interface for day-to-day creative work.
        The product provided board-based organization, editing workflows, and
        async task management on top of a company-wide generation API
      ru: >
        Внутреннее веб-приложение для AI-платформы генерации изображений: им
        пользуются дизайнеры, которым нужен рабочий инструмент на каждый день.
        Продукт дал доски для организации работы, сценарии редактирования и
        управление асинхронными задачами поверх общего для компании API генерации
    role:
      en: >
        Primary ownership on the Angular frontend, with selected end-to-end
        delivery across the FastAPI backend when features required server-side work
      ru: >
        Основная ответственность за фронтенд на Angular плюс сквозная разработка
        на бэкенде FastAPI там, где фиче требовалась серверная часть
    impact:
      value: 1,000+
      label:
        en: internal users
        ru: внутренних пользователей
    stack:
      - Angular
      - TypeScript
      - NgRx
      - RxJS
      - Taiga UI
      - OAuth / SSO
    highlights:
      - en: Built and evolved a board-based workspace where designers organized generations into project spaces instead of a flat task list
        ru: Собрал и развивал рабочее пространство на досках, где дизайнеры раскладывают генерации по проектам вместо плоского списка задач
      - en: Implemented drag-and-drop between boards, image reactions, and editing flows for multiple generation modes
        ru: Реализовал перетаскивание между досками, реакции на изображения и сценарии редактирования для нескольких режимов генерации
      - en: Designed a priority-queue polling model on the frontend to schedule status checks for asynchronous generation tasks without aggressive polling
        ru: Спроектировал на фронтенде модель опроса с очередью приоритетов, чтобы проверять статусы асинхронных генераций без агрессивного поллинга
    resume_highlight:
      en: >
        Owned an Angular UI for internal image-generation workflows, with
        board-based organization, async task polling, reactions, and editing flows
      ru: >
        Отвечал за интерфейс на Angular для внутренней генерации изображений:
        доски, опрос статусов асинхронных задач, реакции и редактирование
  - key: image-generation-bff
    title:
      en: Image Generation BFF
      ru: BFF для генерации изображений
    readme_featured: false
    kind:
      en: FastAPI backend-for-frontend
      ru: Backend-for-frontend на FastAPI
    icon: workflow
    summary:
      en: >
        FastAPI service that connected the frontend to the company-wide
        image-generation API, handling authentication, task lifecycle data,
        and downstream persistence for the interface
      ru: >
        Сервис на FastAPI, связавший фронтенд с общим для компании API генерации
