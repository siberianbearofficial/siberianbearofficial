case_studies:
  - key: image-generation-ui
    title: Image Generation Platform UI
    readme_featured: true
    kind: Internal design workflow tool
    icon: image
    summary: >
      Internal web application for an AI image-generation platform used by
      designers who needed a practical interface for day-to-day creative work.
      The product provided board-based organization, editing workflows, and
      async task management on top of a company-wide generation API
    role: >
      Primary ownership on the Angular frontend, with selected end-to-end
      delivery across the FastAPI backend when features required server-side work
    impact:
      value: 1k+
      label: internal users
    stack:
      - Angular
      - TypeScript
      - NgRx
      - RxJS
      - Taiga UI
      - OAuth / SSO
    highlights:
      - Built and evolved a board-based workspace where designers organized generations into project spaces instead of a flat task list
      - Implemented drag-and-drop between boards, image reactions, and editing flows for multiple generation modes
      - Designed a priority-queue polling model on the frontend to schedule status checks for asynchronous generation tasks without aggressive polling
    resume_highlight: >
      Owned an Angular UI for internal image-generation workflows, with
      board-based organization, async task polling, reactions, and editing flows
  - key: image-generation-bff
    title: Image Generation BFF
    readme_featured: false
    kind: FastAPI backend-for-frontend
    icon: workflow
    summary: >
      FastAPI service that connected the frontend to the company-wide
      image-generation API, handling authentication, task lifecycle data,
      and downstream persistence for the interface
    role: >
      Designed and implemented the original BFF surface, then kept extending it
      as product features moved beyond frontend-only scope
    stack:
      - FastAPI
      - Python
      - PostgreSQL
      - SQLAlchemy
      - Kafka
      - S3
      - OAuth / SSO
      - Alembic
    highlights:
      - Integrated corporate SSO for end users while routing generation requests through a service-level backend path
      - Built an event consumer that processed completed tasks and coordinated persistence across the database and object storage
      - Added backend support for user-facing features such as reactions, board operations, and image post-processing flows
    resume_highlight: >
      Built a FastAPI BFF with SSO integration, event processing,
      database persistence, object storage, and task orchestration for
      an internal image-generation UI
  - key: ai-assistant
    title: Internal AI Assistant
    readme_featured: true
    kind: Internal LLM assistant platform
    icon: messages-square
    summary: >
      Company-wide internal LLM assistant used by thousands of employees.
      The product is built on a mixed Svelte and React frontend with a
      FastAPI backend and is progressively moving toward a React-first
      architecture without pausing feature delivery
    role: >
      Contributed across frontend architecture, quality tooling, and feature
      delivery while the product moved from a legacy frontend toward React
    impact:
      value: 1000s
      label: of internal users
    stack:
      - React
      - TypeScript
      - Svelte
      - FastAPI
      - Vitest
      - Biome
      - Oxlint
      - Playwright
    highlights:
      - Worked in a mixed frontend stack, helping move product logic into React-owned areas while maintaining the existing Svelte surface
      - Shipped product features and supporting backend fixes in parallel with migration work instead of treating them as separate tracks
      - Helped establish stricter frontend quality rails around new React code while the product still carried legacy surface area
    resume_highlight: >
      Contributed to an internal AI assistant with Svelte, React, and FastAPI,
      helping drive frontend migration and feature delivery in parallel for a
      widely adopted internal product

