cv:
  nav:
    focus:
      en: Focus
      ru: Фокус
    experience:
      en: Experience
      ru: Опыт
    case_studies:
      en: Case Studies
      ru: Кейсы
    public_work:
      en: Public Work
      ru: Открытый код
    hire:
      en: Hire Me
      ru: Услуги
    contact:
      en: Contact
      ru: Контакты
  actions:
    pdf_short:
      en: PDF Resume
      ru: Резюме в PDF
    pdf_long:
      en: Download PDF Resume
      ru: Скачать резюме в PDF
  hero:
    kicker:
      en: worldwide remote
      ru: удалённо по всему миру
    portrait_alt:
      en: Photo of Aleksei Orlov
      ru: Фотография Алексея Орлова
  hero_cards:
    - href: "#case-ai-assistant"
      modifier: assistant
      illustration: chat-with-ai
      value:
        en: LLM Assistant
        ru: LLM-ассистент
      label:
        en: Internal AI Product
        ru: Внутренний AI-продукт
      meta:
        en: retrieval, tool calls, React migration
        ru: retrieval, tool calls, миграция на React
    - href: "#case-image-generation-ui"
      modifier: image
      illustration: digital-artwork
      value:
        en: Image Gen UI
        ru: Генерация изображений
      label:
        en: Design Workflow Tool
        ru: Инструмент для дизайнеров
      meta:
        en: Angular frontend ownership
        ru: ответственность за фронтенд на Angular
    # Users, not years. Years are the weakest number on the page and the grade
    # ladder they used to carry meant nothing outside the company.
    - modifier: product
      illustration: developer-activity
      value:
        en: 38,000+
        ru: 38 000+
      label:
        en: employees
        ru: сотрудников
      meta:
        en: internal LLM assistant I ship features on
        ru: внутренний LLM-ассистент, в котором я выпускаю фичи
    - modifier: migration
      illustration: version-control
      value:
        en: Angular to React
        ru: Angular → React
      label:
        en: Migration Profile
        ru: Профиль миграции
      meta:
        en: without feature freeze
        ru: без заморозки фич
  focus:
    kicker:
      en: Focus
      ru: Фокус
    heading:
      en: Specialised in the part of AI products that breaks
      ru: Специализация — та часть AI-продуктов, которая ломается
    lede:
      en: >
        Most teams can get an LLM demo working. I build the layer underneath:
        retrieval that returns the right document, tool calls that fail safely,
        and an interface people open on a Monday morning.
      ru: >
        Демо с LLM соберёт почти любая команда. Я делаю слой под ним: поиск,
        который возвращает нужный документ, вызовы инструментов, которые падают
        безопасно, и интерфейс, который открывают в понедельник утром.
    narrative_label:
      en: Current Narrative
      ru: Чем занят сейчас
  experience:
    kicker:
      en: Experience
      ru: Опыт
    heading:
      en: Recent roles and progression
      ru: Последние роли и рост
    lede:
      en: >
        Official dates come from current employment records. Public copy keeps
        the focus on shipped work, ownership, and NDA-safe scope
      ru: >
        Официальные даты соответствуют трудовым записям. В публичном тексте —
        только то, что сделано, зона ответственности и формулировки, безопасные
        с точки зрения NDA
  case_studies:
    kicker:
      en: Case Studies
      ru: Кейсы
    heading:
      en: Internal product work, shown through ownership and systems thinking
      ru: Внутренние продукты — через зону ответственности и системное мышление
    lede:
      en: >
        The code for these products is not public. What I can show is the
        product surface, architecture, and execution scope behind them
      ru: >
        Код этих продуктов закрыт. Показать я могу продуктовую поверхность,
        архитектуру и объём работы за ними
    role_label:
      en: My role
      ru: Моя роль
  public_work:
    kicker:
      en: Public Work
      ru: Открытый код
    heading:
      en: Selected repos that show how I build
      ru: Избранные репозитории, по которым видно, как я делаю
    lede:
      en: >
        Small, finished pieces of tooling and product work that are open enough
        to read end to end
      ru: >
        Небольшие законченные инструменты и продуктовые куски, которые открыты
        настолько, что их можно прочитать целиком
    # The framing that keeps a hiring reader from grading the candidate on the
    # maturity of side projects. It is the same argument the .dev surface makes.
    note_title:
      en: How to read these repositories
      ru: Как читать эти репозитории
    note_body:
      en: >
        Public repos are not a mirror of my current internal stack. They are the
        evidence layer for how I structure projects, ship tooling, and think
        about APIs and product surfaces. The products I actually work on are
        internal and closed-source, so their scale is described in the case
        studies above rather than shown in code
      ru: >
        Публичные репозитории не отражают мой текущий рабочий стек. Это слой
        доказательств того, как я структурирую проекты, довожу инструменты до
        конца и думаю об API и продуктовых поверхностях. Продукты, над которыми
        я работаю на самом деле, внутренние и с закрытым кодом, поэтому их
        масштаб описан в кейсах выше, а не показан кодом
    supporting_kicker:
      en: Supporting Project
      ru: Дополнительный проект
  stack:
    kicker:
      en: Stack
      ru: Стек
    heading:
      en: Comfortable across product, platform, and delivery
      ru: Уверенно себя чувствую в продукте, платформе и доставке
  education:
    kicker:
      en: Education
      ru: Образование
    heading:
      en: Formal education and long-term signals
      ru: Образование и долгосрочные сигналы
  languages:
    kicker:
      en: Languages
      ru: Языки
    heading:
      en: Working languages
      ru: Рабочие языки
  achievements:
    kicker:
      en: Highlights
      ru: Достижения
    heading:
      en: Signals beyond the day job
      ru: Что за пределами основной работы
  contact:
    kicker:
      en: Contact
      ru: Контакты
    heading:
      en: If you are hiring, start here
      ru: Если вы нанимаете — начните отсюда
    lede:
      en: >
        I’m most useful on teams shipping AI features that have to work for real
        users: retrieval, tool calling, and the async plumbing underneath, with
        the React interface and the FastAPI service behind it owned by the same
        person
      ru: >
        Я полезнее всего в командах, которые выпускают AI-фичи для живых
        пользователей: retrieval, tool calling и вся асинхронная обвязка под
        ними, где интерфейс на React и сервис на FastAPI ведёт один человек
  # Contract work is the main track, not the consolation prize, so this band
  # does not open by ruling out the hiring reader.
  cv_band:
    title:
      en: Have something specific that needs building or fixing?
      ru: Есть что-то конкретное, что нужно сделать или починить?
    meta:
      en: Scope, prices, and delivery dates are on aleksei-orlov.dev
      ru: Объём работ, цены и сроки — на aleksei-orlov.dev

